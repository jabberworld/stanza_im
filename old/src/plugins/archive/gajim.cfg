[header]
'type'='chatskin'
'name'='Gajim based chatskin'
'license'='GPL'
'version'='0.1'
'author'='Jan Kaluža'
'description'='Gajim based chatskin'

[chatskin]
my_message='<b>[[time]]</b> <font color="#164e6f"><b>[user]:</b></font> [message]<br/><br/>'
message='<b>[[time]]</b> <font color="[foreground]"><b>[user]:</b></font> [message]<br/><br/>'
message_for_me='<b>[[time]]</b> <font color="red"><b>[user]:</b> [message]</font><br/><br/>'
me_message='<b>[[time]]</b> <font color="[foreground]">* [user] [message]</font><br/><br/>'
my_me_message='<b>[[time]]</b> <font color="#164e6f">* [user] [message]</font><br/><br/>'
status_message='<b>[[time]]</b> <font color="#1eaa1e"> [message]</font><br/><br/>'
gc_status_message='<b>[[time]]</b> <font color="#1eaa1e"> [nick] is now [show] [[message]]</font><br/><br/>'
my_message_history='<font size="-1"><b>[[time]]</b> <font color="#164e6f"><b>[user]:</b></font> [message]</font><br/><br/>'
message_history='<font size="-1"><b>[[time]]</b> <font color="#a34526"><b>[user]:</b></font> [message]</font><br/><br/>'
message_for_me_history='<font size="-1"><b>[[time]]</b> <font color="red"><b>[user]:</b> [message]</font></font><br/><br/>'
status_message_history='<font size="-1"><b>[[time]]</b> <font color="#1eaa1e"> [message]</font></font><br/><br/>'
color1="#a34526","#FFE4E4" # tmave cervena
color2="#c000ff","#EDCDFF" # fialova
color4="#388a99","#DFFFF9" # tyrkysova
color5="#045723","#DFFFE5" # tmave zelena
color6="#7c7c7c","#F6F6F6" # seda
color7="#ff8a00","#FFFFC9" # oranzova
color8="#94452d","#FFE2D4" # tmave hneda
