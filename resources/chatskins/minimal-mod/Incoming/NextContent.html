		%time%
	</span>

    <span class="message_actions">
        <a class="action-reply" href="stanza:reply:%REPLY_TARGET%" title="%reply_title%">↰</a>
        <button type="button" data-action="menu" data-copy-label="%copy_label%">...</button>
    </span>
	<div class="placeholder_next" visible="%userIconPath%">
        <span class="next_label incoming">
            
        </span>
        <span class="message incoming_link">
            %message%
        </span>
    </div>

</div>
<span id="insert"></span>
