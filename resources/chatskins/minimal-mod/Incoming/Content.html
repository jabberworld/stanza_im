<div class="container" style="background-color:%textbackgroundcolor{.75}%;">
    <span class="time_initial">
		%time%
	</span>

    <span class="message_actions">
        <button type="button" data-action="reply" title="%reply_title%">↰</button>
        <button type="button" data-action="menu">...</button>
    </span>
    <span class="buddyicon">
        <img src="%userIconPath%" width="24" height="24" class="avatar" />
    </span>
    <div class="placeholder" visible="%userIconPath%">
        <span class="sender incoming"><span style="color:%senderColor%;">
            %sender%
        </span></span>
        <span class="message incoming_link">
            <br>%message%
        </span>
    </div>
    <span class="clear"></span>
</div>
<span id="insert"></span>
