<div class="incoming_row">
	<span class="timestamp">%time%</span>
	<span class="message_actions">
		<a class="action-reply" href="stanza:reply:%REPLY_TARGET%" title="%reply_title%">↰</a>
		<a class="action-delete" href="stanza:delete:%DELETE_TARGET%" title="%delete_title%">✕</a>
		<button type="button" data-action="menu" data-copy-label="%copy_label%">...</button>
	</span>
	%sender% 
</div>
<div class="message_incoming" style="background-color:%textbackgroundcolor{0.75}%;">
	%message%
	<div id="insert"></div>
</div>
