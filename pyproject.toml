[project]
name = "jabbim-next"
version = "0.1.0"
description = "A user-friendly XMPP/Jabber client inspired by Jabbim"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
dependencies = [
    "PyQt6>=6.5",
    "PyQt6-WebEngine>=6.5",
    "slixmpp>=1.8",
    "defusedxml>=0.7",
    "qasync>=0.27",
]

[project.scripts]
jabbim = "jabbim.app:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
